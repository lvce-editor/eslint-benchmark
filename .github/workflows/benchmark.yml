name: ESLint diagnostic benchmark
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eslint-benchmark-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    name: test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, windows-2025, macos-15, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set Playwright browser path
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run type-check
      - run: npm test
  benchmark:
    name: benchmark (ubuntu-24.04)
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install-deps chromium
      - name: Install Playwright headless shell
        env:
          DEBUG: pw:install
        run: |
          df -hT /tmp "$RUNNER_TEMP"
          timeout --signal=TERM --kill-after=10s 5m bash -c '
            npx playwright install --only-shell chromium &
            install_pid=$!
            while kill -0 "$install_pid" 2>/dev/null; do
              echo "Playwright install process snapshot:"
              ps -eo pid,ppid,pgid,stat,etime,wchan:32,cmd --forest | grep -E 'npx playwright|playwright|node|unzip' || true
              find /tmp -maxdepth 2 -path "/tmp/playwright-download-*/*" -type f -printf "%s bytes %p\\n" 2>/dev/null || true
              find "$PLAYWRIGHT_BROWSERS_PATH" -maxdepth 4 -type f -printf "%s bytes %p\\n" 2>/dev/null | head -n 20 || true
              du -sh "$PLAYWRIGHT_BROWSERS_PATH" 2>/dev/null || true
              sleep 30
            done
            wait "$install_pid"
          '
      - run: npm run setup
      - run: ITERATIONS=3 npm run benchmark
      - run: npm run report
      - run: npm run test:report
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: eslint-benchmark-${{ github.run_id }}
          path: |
            results/
            .tmp/cache/setup.json
            .tmp/pages/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: .tmp/pages
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: benchmark
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
